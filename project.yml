name: StudyPlanner
options:
  bundleIdPrefix: com.mubashir
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
targets:
  StudyPlanner:
    type: application
    platform: iOS
    sources:
      - StudyPlanner
      - Shared
    dependencies:
      - target: FocusActivity
    configFiles:
      Debug: Config/App.xcconfig
      Release: Config/App.xcconfig
    info:
      path: StudyPlanner/Info.plist
      properties:
        APIBaseURL: $(API_BASE_URL)
        GoogleClientID: $(GOOGLE_IOS_CLIENT_ID)
        GoogleRedirectScheme: $(GOOGLE_REVERSED_CLIENT_ID)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLSchemes:
              - studyplanner
          - CFBundleURLSchemes:
              - $(GOOGLE_REVERSED_CLIENT_ID)
    settings:
      base:
        DEVELOPMENT_TEAM: SN95YBF5Z3
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCalendarsFullAccessUsageDescription: "StudyPlanner reads your calendars to find classes, work shifts and deadlines so it can plan study time around them. It doesn't change your events."
        CODE_SIGN_ENTITLEMENTS: $(SP_ENTITLEMENTS)
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
  FocusActivity:
    type: app-extension
    platform: iOS
    sources:
      - FocusActivity
      - Shared
    info:
      path: FocusActivity/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mubashir.StudyPlanner.FocusActivity
        DEVELOPMENT_TEAM: SN95YBF5Z3
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1"
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 0.1.0
        SKIP_INSTALL: true
        APPLICATION_EXTENSION_API_ONLY: true
  StudyPlannerTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - StudyPlannerTests
    dependencies:
      - target: StudyPlanner
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        SWIFT_VERSION: "5.10"
  StudyPlannerUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - StudyPlannerUITests
    dependencies:
      - target: StudyPlanner
    settings:
      base:
        GENERATE_INFOPLIST_FILE: true
        SWIFT_VERSION: "5.10"
schemes:
  StudyPlanner:
    build:
      targets:
        StudyPlanner: all
    test:
      targets:
        - StudyPlannerTests
        - StudyPlannerUITests
